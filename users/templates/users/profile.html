<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile | StayGrid</title>
</head>

<body>

    <h1>My StayGrid Profile</h1>

    <p>
        <strong>Name:</strong>
        {{ request.user.get_full_name }}
    </p>

    <p>
        <strong>Username:</strong>
        {{ request.user.username }}
    </p>

    <p>
        <strong>Email:</strong>
        {{ request.user.email }}
    </p>

    <p>
        <strong>Phone:</strong>
        {{ profile.phone_number }}
    </p>

    <p>
        <strong>Verified:</strong>
        {{ profile.is_verified }}
    </p>

    <a href="{% url 'home' %}">Home</a>

</body>
</html>

<div class="form-group">

    <label
        class="form-label"
        for="phone_number"
    >
        Phone number
    </label>

    <input
        id="phone_number"
        class="form-control"
        type="text"
        name="phone_number"
        value="{{ profile.phone_number }}"
    >

</div>
