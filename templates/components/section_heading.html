<header class="section-heading">

    <div>

        {% if eyebrow %}

            <span class="section-eyebrow">
                {{ eyebrow }}
            </span>

        {% endif %}

        {% if title %}

            <h2>
                {{ title }}
            </h2>

        {% endif %}

        {% if description %}

            <p>
                {{ description }}
            </p>

        {% endif %}

    </div>


    {% if action_url and action_text %}

        <a
            href="{{ action_url }}"
            class="btn btn-secondary"
        >
            {{ action_text }}
            <span>→</span>
        </a>

    {% endif %}

</header>
