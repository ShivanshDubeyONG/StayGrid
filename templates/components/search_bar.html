<form
    method="GET"
    action="{% url 'hotel_list' %}"
    class="search-panel"
    data-search-form
>

    <!-- DESTINATION -->

    <div class="search-field search-destination">

        <span class="search-icon">
            ⌖
        </span>

        <div class="destination-input-wrap">

            <label for="search-location">
                Destination
            </label>

            <input
                id="search-location"
                type="text"
                name="location"
                value="{{ request.GET.location|default:'' }}"
                placeholder="Where are you going?"
                autocomplete="off"
            >

            <!-- AUTOCOMPLETE -->
            <div
                id="destination-suggestions"
                class="destination-suggestions"
            ></div>

        </div>

    </div>


    <div class="search-divider"></div>


    <!-- CHECK IN -->

    <div class="search-field">

        <span class="search-icon">
            ◷
        </span>

        <div>

            <label for="search-check-in">
                Check in
            </label>

            <input
                id="search-check-in"
                type="date"
                name="check_in"
                value="{{ request.GET.check_in|default:'' }}"
            >

        </div>

    </div>


    <div class="search-divider"></div>


    <!-- CHECK OUT -->

    <div class="search-field">

        <span class="search-icon">
            ◷
        </span>

        <div>

            <label for="search-check-out">
                Check out
            </label>

            <input
                id="search-check-out"
                type="date"
                name="check_out"
                value="{{ request.GET.check_out|default:'' }}"
            >

        </div>

    </div>


    <div class="search-divider"></div>


    <!-- GUESTS -->

    <div class="search-field search-guests">

        <span class="search-icon">
            ◉
        </span>

        <div>

            <label for="search-guests">
                Guests
            </label>

            <input
                id="search-guests"
                type="number"
                name="guests"
                value="{{ request.GET.guests|default:'1' }}"
                min="1"
                max="20"
            >

        </div>

    </div>


    <!-- SUBMIT -->

    <button
        type="submit"
        class="search-submit"
        aria-label="Search stays"
    >
        →
    </button>

</form>
