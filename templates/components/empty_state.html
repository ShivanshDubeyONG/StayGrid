<div class="empty-state" data-reveal>

    <div class="empty-state-icon">
        {{ icon|default:"◇" }}
    </div>


    <h3>
        {{ title|default:"Nothing here yet." }}
    </h3>


    <p>
        {{ message|default:"There isn't anything to show right now." }}
    </p>


    {% if action_url and action_text %}

        <a
            href="{{ action_url }}"
            class="btn btn-primary"
        >
            {{ action_text }}
        </a>

    {% endif %}

</div>
