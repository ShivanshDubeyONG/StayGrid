<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit {{ hotel.name }} | StayGrid</title>
</head>

<body>

    <h1>Edit Hotel</h1>

    <p>
        {{ hotel.name }}
    </p>

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Save Changes
        </button>
    </form>

    <br>

    <a href="{% url 'vendor_dashboard' %}">
        ← Back to Dashboard
    </a>

</body>
</html>
